
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediplan-gateway

spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # Redirection vers le microservice des médecins
          - path: /doctors
            pathType: Prefix
            backend:
              service:
                name: doctor-service
                port:
                  number: 8081

          # Redirection vers le microservice des rendez-vous
          - path: /appointments
            pathType: Prefix
            backend:
              service:
                name: appointment-service
                port:
                  number: 8080
